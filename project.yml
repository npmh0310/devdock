name: DevDock
options:
  bundleIdPrefix: local.personal
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  DevDock:
    type: application
    platform: macOS
    sources:
      - path: DevDock
    dependencies:
      - package: Defaults
      - package: KeyboardShortcuts
    info:
      path: DevDock/Resources/Info.plist
      properties:
        CFBundleDisplayName: DevDock
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 npmh0310"
        LSUIElement: true
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DevDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DevDockTests
    dependencies:
      - target: DevDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DevDock.app/Contents/MacOS/DevDock"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

schemes:
  DevDock:
    build:
      targets:
        DevDock: all
        DevDockTests: [test]
    test:
      targets:
        - DevDockTests
